<!-- 最前面声明这是html格式文件 -->
<!DOCTYPE html>
<!-- html标签：根标签也是最大的标签，用于包裹全文 -->
<html lang="en">
<!-- 网页头部，用于放置给浏览器看的信息 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- 网页主体，用于存放给用户看的信息，不可以调整大小，是浏览器框大小。 -->
<body>
    <!-- 
    html——超文本（即链接）标记（标签，即带<>的文本）语言 
        文件以.html为文件扩展名
        网站以一堆块组成
            同级块元素默认垂直不同行排列
    -->
    <!-- 
    html只认标签，学html学的就是标签
        单双标签分类：
            一般 <xxx></xxx>双标签，前面为开始标签，后面为结束标签
            数量很少，不能作为容器的<xxx>单标签
        块与内联标签分类：
            块标签：
                可以设置宽高，默认高度有内容决定，宽度由为父级百分百
                独占一行
                除了个别内联标签建议不要，块标签内部可以放置任意标签
            内联标签：
                不能设置宽高，宽高由内容决定
                同级内联元素默认不换行，直到父级装不下自动换行
                内联标签内部建议不允许放置块标签，只能放置内联标签
                注意：内联标签无论是内间距padding还是外间距margin，只有左右生效，上下不生效。
    -->
    <!-- 接下来就是具体标签了 -->
    <!-- 标题标签：块，双，h1~h6，数字越大内容文字越小，文字加粗，但是一般正式使用时都会重新书写样式 -->
    <h1>这是大标题</h1>
    <h6>这是小标题</h6>
    <!-- 
    段落标签：块，双，p，一般时用于包裹一段内容，包裹的内容前后换行。
        一般来说会主动设置一行的宽度
        英文由于以空格区分不同单词，而一个单词写完前不会换行，因此结尾可能由于单词过长而超出
    -->
    <p>这是第一段。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。。ddddddddddddddddddddddddddddddddddddddddddd</p>
    <p>这是二段</p>
    <!-- 换行标签：内联，单，br，作用就是换行，不过相比段落标签，间隔没有那么大 -->
    这是换行前<br>这是换行后
    <!-- span标签：内联，双，一般内部都是放一些不带链接的大而短的文字，也可以作为容器用于放置其它内联标签 -->
    <span>这是第一句话</span><span>这是第二句话</span>
    <!-- 
    div标签：块，双，最常用的标签，用于画块，常用于画结构，理论上是万能标签，甚至可以只用div标签做网页
    -->
    <div>第一段</div>
    <div>第二段</div>
    <!-- 
    a标签：内联，双，内部可以用于放置文本，但一般用于做超链接————属性href="链接地址"
        其不会被父级的样式影响，因为自带样式————蓝色带下划线
        默认点击原网页跳转，可以添加属性target="_blank"，以达到点击后再新网页打开
    -->
    <a href="https://www.baidu.com">原网页跳转</a>
    <a href="https://www.baidu.com" target="_blank">新开网页跳转</a>
    <!-- 
    列表标签：块，双，最外层ul，表示一个列表处，多个li，表示每行
        实际上ul和li直接子级什么都可以放，但是ul直接子级一般只放li
        ul自带间距，li也自带样式，一般都要去掉
            去掉ul的：*{margin:0;padding:0;}
            去掉li的：list-style:none;
        一般在一个项目多个条目样式相同重复地出现，就用列表，比如导航条
    -->
    <ul>
        <li>首页</li>
        <li>用户</li>
        <li>联系方式</li>
    </ul>
    <!-- 
    图片标签：内联，单，img，用于引入图片，属性src="图片路径"来引入图片
        大小默认为图片大小，虽然是内联元素但可以设置宽高
            如果只设置宽或者高，图片会等比例放大或者缩小
            如果同时设置宽和高，图片会扭曲强行改变到相应宽高
        其它属性
            width="宽"，默认单位px
            height="高"，默认单位px
            alt="文本"，图片没有加载出来时，显示的文本
            title="文本"，鼠标放在图片上时，鼠标旁边浮现的文本
        显示特点
            图片标签底部默认有一小节间隔，其与margin、padding都无关
            和图片标签同行的元素，默认对齐最底部（图片标签最底部包括其底部一小节间隔）
        由于是单标签，其内部无法进行内容编辑
    -->
    <img src="https://img2.baidu.com/it/u=2423202438,4004813241&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=667" title="原始图片">
    <img src="https://img2.baidu.com/it/u=2423202438,4004813241&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=667" title="只设置宽" width="200">
    <img src="https://img2.baidu.com/it/u=2423202438,4004813241&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=667" title="只设置高" height="200">
    <img src="https://img2.baidu.com/it/u=2423202438,4004813241&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=667" title="同时设置宽高" height="200" width="200">
    <!-- 
    表单标签：内联，单，input，实质上是一个输入框，所有的输入框都可以以这个为基础创作
        同img标签，表单标签也可以设置宽高。
        一些属性
            placeholder="占位符"，这个占位符就是输入框初始就有的文字，用户输入后就会消失
            value="值"，输入框的值，用户输入的值就是这个value，如果设置了就代表输入框的内的默认值
            name="名"，用于帮助后端识别区分不同的用途，但如今有了ajax后，基本不用了
            type="种类"，用于设置表单的种类
                text：默认值，文本输入框，即正常的文本输入
                password：密码输入框，输入的字符会被隐藏，就像是小黑点
                其余的没那么重要：
                    button：和button标签一模一样，用value属性来规定按钮的文字
                    submit：就是自带“提交”文字的button
                    checkbox：多选框，表现是每个input都是一个多选框，一个方形框，点击后会打钩
                    radio：单选框，每个input是一个框，是一个空圆圈，点击后会出现蓝色实心圆
                        多个单选框如果name属性相同，那么就是一组，多个单选框中只能选中一个
    -->
    <input type="text" placeholder="占位符">
    <input type="text" value="原本文本">
    <input type="password">
    <!-- 
    文本域标签：内联，双，textarea，表现就是一个大型的文本框，双标签中间的文本就是初始文本，可以设定多行多列，即规定的文本框行数和列数
        属性
            cols="行数"
            rows="列数"
    -->
    <textarea name="" id="" rows="3" cols="5">123</textarea>
    <!-- 
    下拉选择框：内联，双，select，即点击后出现下拉选项
        虽然内联但是能设置宽高样式
        子选项：option标签，写在select双标签内部，每个option标签就是一个选项
            属性
                value="值",用以区分不同选项，可以省略，默认以option包裹的内容当做value
                selected，当有option标签添加了这个属性时，代表这个选项为默认选择
    -->
    <select name="" id="">
        <option>选项1</option>
        <option selected>选项2</option>
        <option>选项3</option>
    </select>
    <!-- 
    按钮标签：内联，双，button，用于设置按钮，拥有自带的样式————文字完全居中，自带背景样式
        虽然内联但是可以甚至宽高样式
        属性
            disabled=true，表示按钮变为禁用状态
    -->
    <button>按钮1</button>
    <button disabled>按钮2</button>
    <!-- 
    表格标签：块，双，table、thead、tbody、tr、td几个标签组成
        很古老时候用来布局，现在已经单纯用来画表格
        各个标签：
            table：表示整个表格
            thead表示表格头部，写在表格开头，tbody表示表单的主体，这两个如今一般不用写了
            tr表示表单的一行,一般thead里面只有一对tr
            th和td表示单个的单元格，只是th只写在thead中，里面只写在thead里面
                属性
                    rowspan="数值"，数值代表这格占几行
                    cowspan="数值"，数值代表这格占几列
        这所有的标签，如今一般只写table里面多个tr，每个tr里面多个td
    -->
    <table>
        <tr>
            <td>1-1</td>
            <td>1-2</td>
            <td rowspan="2">1-3</td>
        </tr>
        <tr>
            <td colspan="3">2-1</td>
            <td>2-2</td>
            <td>2-3</td>
        </tr>
        <tr>
            <td>3-1</td>
            <td>3-2</td>
            <td>3-3</td>
        </tr>
    </table>
    <!-- 水平线标签：如今完全不用了，单，块，hr，独占一行的水平线 -->
    <hr>

    <!-- 
    html5，即html的5.0版本。
    而h5原本指的是html5，广义上指的是随着html5出现发展所出现的各种应用技术
    -->
    <!-- 接下来就是html5的标签 -->
    <!-- 
    视频标签：两个标签，video双标签内部包裹source单标签
        可以只写video标签，但这样就是单个播放器，而内部写source标签可以同时设置多个播放器。
        video的属性
            width="数值"，播放窗口宽
            height="数值"，播放窗口高
            controls，添加后视频播放窗口会出现控制力控件
            autoplay，打开网页后自动播放
            loop，循环播放
            src="视频地址"，指定播放的视频
        source的属性
            src="视频地址"，指定播放的视频
    -->
    <video width="200px" height="200px" controls loop>
        <source src="https://vd2.bdstatic.com/mda-ria1pxy4md302may/720p_frame30/h264_cae/1757553132518127314/mda-ria1pxy4md302may.mp4?v_from_s=bdapp-landingpage-hnb">
    </video>
    <video width="200px" height="200px" controls autoplay>
        <source src="https://vd2.bdstatic.com/mda-ria1pxy4md302may/720p_frame30/h264_cae/1757553132518127314/mda-ria1pxy4md302may.mp4?v_from_s=bdapp-landingpage-hnb">
    </video>
    <!-- 
    音频标签：一切同视频标签，只是video换成audio，属性也相同
    -->
    <audio controls autoplay loop>
        <source src="">
    </audio>
    <!-- 
    语义标签：一类标签的统称。其实就是div标签，只是换了个名字，帮助识别不同地方的div标签
        实质上开发中基本不使用，因为使用的都是框架
    -->
    <!-- 剩余的都涉及到了js,之后再说 -->


    <!-- 
    网站的分块原则：
        1.从大到小，逐级划分
        2.最重要的一点：同级元素不允许即有同一行又有在同一列的，比如田字这样的分布就不行
            应该先按行或者列分，再在每行或者每列中单独分。比如田字可以分为左右两个日字，再一个单独的日子分为上下两个口字
            正是因为这个原则，用clear清除浮动的div元素永远不会在中间元素出现
        3.符合常识，符合认知。比如并排四个元素，把前三个划为一块，后面一个划为一块，就不符合认知，应该四个先是一块，再四个单独分
    网站的分类要分到不能分为止————仅剩一张图片或一段文字或一个图标等等
    -->

    <!-- 
    网页上的调试：
        按F12键或右键后点“检查”：
            弹出的框第一个标签页Element/元素————可以直接修改，达到更好地调试
                左边显示了整个网页的html文件
                右边显示了这个网页的样式
            标签页application/应用=>top=>图片 可以找到这个网页所用的图片
    -->

    <!-- 
    块元素的宽高总结：
        默认宽度：
            普通情况：父级的百分百，即使加了左右的padding，默认总宽度也是父级百分百，不会超出
            脱离文档流元素（浮动、定位）：由子级+padding+描边决定，清除了浮动也一样
        默认高度：由子级+padding+描边决定
        但是只要设置了宽高样式，则其宽高一定由设置决定，不受其他任何因素影响
    -->

    <!-- 
    html的特殊符号————末尾一定要加英文格式分号
        &nbsp;：表示空格
            因为程序默认在两个字符之间最多只读取键盘一个空格
        &lt;：左尖括号<
        &gt;：右尖括号>
    -->
    <div>
        &lt;1&nbsp;&nbsp;2&nbsp;3&gt;
    </div>


    <!-- 重要！！！
    BFC，块级格式化上下文————即一个特殊的容器，一个独特的布局区域，区域内部和区域外部互不影响
        bfc内部布局规则：
            1.内部的块会在垂直方向上一个接一个排列
            2.块在垂直方向上的距离由本身的margin决定，并且同一个bfc内部，不同块会在垂直方向产生margin合并
            3.每个块左边缘紧贴父级块的左边缘
            4.开启了bfc的块不会与float的块重叠，会贴着浮动元素显示
                可以用这个实现左侧块，右边的块自适应宽度（随着窗口变化）
            5.bfc是一个独立的容器，里外互不影响
            6.计算bfc高度时，浮动的自己也算在内，也就是说可以被浮动的子级撑起来
                不会出现子级浮动导致的脱离文档流从而父级高度坍塌的情况
    
    -->
    
</body>
</html>
