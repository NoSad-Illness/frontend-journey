<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .in{background-color: green;}
    </style>
    <link rel="stylesheet" href="css基础知识.css">
    <title>css样式</title>
</head>
<body>
    <!-- css：给标签添加样式 -->
    <!-- 
    添加css样式的三种方式：
        1.内联样式/行内样式：直接在开始标签的style属性内添加。
        2.内部样式：在head标签内添加style标签，标签内写样式。
            <style>选择器1{样式a1;样式b1;...}选择器2{样式a2;样式b2;...}</style>
            选择器：可以指定这个样式作用于哪些html标签。
            常用选择器；
                标签选择器：选择器直接使用标签名，表示此样式直接对所用这个标签生效。
                类选择器；
                    首先在对应标签内部添加属性 class="类名"
                        类名：
                            1.绝对不能使用中文、除了-和_之外的特殊符号
                            2.不能数字开头，也不能使用纯数字
                            3.不能使用空格——空格两边表示一个标签的不同类名
                            4.最好要：
                                a.全小写
                                b.见名知意
                            5.不同标签可以使用同一类名
                    然后使用 .类名 作为选择器，表示此样式只对此类名的标签生效
                id选择器：
                    首先在对应标签内部添加属性 id="id名"
                        id名要求和类名相同，但是不同标签的id不能相同
                    然后使用 #id名 作为选择器，表示此样式只对此id名的标签生效
            常用选择器的拓展：
                后代选择器：
                    父级选择器 子级选择器{样式}
                        表示和父级选择器的标签下所有满足自己选择器的标签都生效
                            不一定要直接子父级，包含就行
                            可以延伸无数层，只要用空格隔开
                直接子选择器：
                    父级选择器>子级选择器{样式}
                        类似后代选择器，唯一不同的点是选择器选择的父子元素必须是直接子父级关系
                并列选择器：
                    选择器1,选择器2{样式}
                        表示同时对选择器1和选择器2生效，当然，选择器可以无限添加
                        注意：每个选择器的符号都要单独写完整
                *选择器：
                    *{样式}
                        表示对所有标签生效
            伪类：
                选择器:伪类{样式}
                    表示在某些情况下这个样式才生效。
                    常见的有：
                        :link 默认
                        :visited 链接被访问过后生效
                        :hover 鼠标在元素位置时生效
                        :active 元素被点击时鼠标处于点击状态时生效
        3.外部样式：
            创建一个css文件，内部写样式
                css文件内：写法和内部样式的style标签内的内容一模一样。
                html文件内：在head标签内添加link单标签：
                    <link rel="stylesheet" href="css文件地址">
                        rel="stylesheet"：表示此文件是样式文件
                        href="css文件地址"：表示css文件的地址
                    一个html文件可以使用多个link标签来引入多个css文件
    样式之间用分号;隔开
    -->
    <!-- 样式的优先级
        当给特定标签添加样式时
            首先，如果不重复冲突，当然是所有样式生效
            其次，同一种方法和相同选择器给添加的样式，如果重复，那么重复部分后面的覆盖前面的样式
            再者，如果不同的方法添加重复的样式
                如果是添加css方法不同，样式生效的优先级：内联样式>内部样式>外部样式 
                如果是同一方法，选择器不同，样式生效优先级：id选择器>类选择器>标签选择器
            最后，在对应的样式后面添加 !important，此时这个样式的优先级最高。
    -->
    <!-- 内联样式 -->
    <div style="background-color: red;">这是内联样式</div>
    <div class="in">内部样式</div>
    <div id="out">外部样式</div>
</body>
</html>
